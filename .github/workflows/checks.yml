name: Build and publication checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 scripts/check_publication.py
      - name: Scan source and complete public history
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl --fail --location --silent --show-error -o /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks dir . --config .gitleaks.toml --redact=100 --no-banner
          /tmp/gitleaks git . --config .gitleaks.toml --log-opts=--all --redact=100 --no-banner
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: evmd/go.mod
          cache-dependency-path: |
            go.sum
            evmd/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: filetrust/evm/package-lock.json
      - run: make build
      - run: ./build/filetrustd version
      - run: make contracts
